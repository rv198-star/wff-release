interface:
  display_name: "Phase-3 Frontend Implementation"
  short_description: "Implement web surfaces from frozen contracts and prototype truth"
  default_prompt: "Use $wff-impl-frontend to materialize only the bounded `@wff:agentic-begin/end` regions created by the canonical P3 frontend authoring route. Treat everything outside those regions as Workflow-owned protected shell; do not edit route/page identity, source hashes, accepted P3/backend bindings, or other shell content. Before authoring, enforce the pre-execution gate on real authority: refuse when consumer/business outcome truth, service/API/request-response/state/security authority, or accepted route/interaction identity is missing, contradictory, `blocked`, `review-bound`, or `stale`. Do not refuse merely because page_blueprint_type, component regions, shell, navigation, copy, responsive behavior, accessibility realization, or other implementation-local product details are unspecified; decide those at P3, record material refinements as canonical Authority Delta, and keep material product/architecture/UX decisions human-queryable in the fixed project-level `p3-realization-decisions.md` without rewriting PRD/ESP. When frontend targets already exist in accepted P3 authority, preserve that exact denominator. When continuing an accepted backend-first P3 decision with zero Web targets, add only exact slice/operation-bound Web targets through a P3 frontend-extension Authority Delta and never mutate backend targets or the P3 decision digest. If the gate fails, return `PHASE-3 FRONTEND EXECUTION REFUSED` with Reason, Required upstream action, and Affected pages. Inside the bounded regions, create page-specific business composition and behavior assertions using the generated typed client/shared types and accepted UI IA; reject generic renderers, API-explorer patterns, visible prototype/authority metadata, and guessed business/API/security truth. Keep loading/empty/denied/error/recovery states explicit. After materialization, rerun against the same accepted P3 decision/root. `authoring.status=materialized` proves source realization only: do not claim browser/runtime evidence, Trace confirmation, P4/product acceptance, production readiness, or UAT."
